<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0B0E14">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>MLBB TOP</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>

<body>
  <main class="app">
    <header class="top">
      <button class="ib" id="back" aria-label="Indietro"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg></button>
      <div class="brand"><b>MLBB TOP</b><small id="sub">Tactical Telemetry</small></div>
      <div class="tr"><button class="ib" id="srch" aria-label="Cerca"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7" />
          <path d="M21 21l-4.3-4.3" />
        </svg></button><button class="ib" id="act" aria-label="Profilo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0" />
          <circle cx="16" cy="6" r="2" />
          <circle cx="10" cy="12" r="2" />
          <circle cx="18" cy="18" r="2" />
        </svg></button></div>
    </header>
    <div class="subnav" id="subnav"></div>
    <!-- le sezioni delle schermate (id="v-...") le crea js/ui.js -->
    <nav id="nav"></nav>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="sheet top" id="ssheet">
      <div class="box">
        <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.3-4.3" />
          </svg><input id="sq" placeholder="Cerca eroi, oggetti, talenti, spell" aria-label="Cerca in tutta l'app"
            autocomplete="off"><button class="lnk" id="sx">Chiudi</button></div>
        <div id="sres"></div>
      </div>
    </div>
    <div class="sheet" id="sheet">
      <div class="box">
        <h3 id="pt"></h3>
        <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.3-4.3" />
          </svg><input id="q" placeholder="Cerca un eroe" aria-label="Cerca un eroe"></div><button class="btn rd rm"
          id="rm">Rimuovi eroe dallo slot</button>
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </main>
  <script src="data/data.js"></script>
  <script src="data/data-it.js"></script>
  <script src="js/core.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/build.js"></script>
  <script src="js/draft.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/lane.js"></script>
  <script src="js/quick.js"></script>
  <script src="js/tier.js"></script>
  <script src="js/heroes.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/start.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/search.js"></script>
  <script src="js/home.js"></script>
  <script src="js/system.js"></script>
</body>

</html>
