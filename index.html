<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0E14">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>MLBB TOP</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0B0E14;
      --panel: #161B26;
      --panel2: #1B2130;
      --line: #2A3345;
      --line2: #3A4660;
      --text: #E8ECF4;
      --mute: #8E98AC;
      --dim: #5C6680;
      --blue: #2563EB;
      --blueT: #5B8CFF;
      --blue2: #A9C3FF;
      --green: #4ADE80;
      --amber: #F59E0B;
      --red: #F87171;
      --glow: rgba(37, 99, 235, .35);
      --hd: 'Space Grotesk', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      color-scheme: dark;
      box-sizing: border-box
    }

    body.hc {
      --bg: #000;
      --panel: #0B0B0B;
      --panel2: #141414;
      --line: #5A5A5A;
      --line2: #8A8A8A;
      --text: #FFF;
      --mute: #D0D0D0;
      --dim: #A0A0A0;
      --blue: #7FA8FF;
      --blueT: #7FA8FF;
      --blue2: #CFE0FF;
      --glow: transparent
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    body {
      margin: 0;
      background: #06080C;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      display: flex;
      justify-content: center
    }

    button,
    input {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px
    }

    .app {
      width: 100%;
      max-width: 390px;
      height: 100dvh;
      background: var(--bg);
      background-image: linear-gradient(rgba(255, 255, 255, .018) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .018) 1px, transparent 1px);
      background-size: 22px 22px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px)
    }

    @media (min-width:430px) {
      .app {
        height: 844px;
        margin: 20px 0;
        border-radius: 36px;
        border: 1px solid var(--line)
      }
    }

    /* header */
    .top {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--line);
      background: rgba(14, 18, 26, .92)
    }

    .ib {
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      display: grid;
      place-items: center;
      color: var(--text);
      border-radius: 10px
    }

    .ib:hover {
      background: var(--panel)
    }

    .ib.hide {
      visibility: hidden
    }

    .brand {
      text-align: center;
      line-height: 1.1
    }

    .brand b {
      font-family: var(--hd);
      font-size: 21px;
      letter-spacing: .14em;
      color: var(--blue2);
      font-weight: 700
    }

    .brand small {
      display: block;
      font-size: 9.5px;
      letter-spacing: .22em;
      color: var(--mute);
      margin-top: 3px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    /* screens */
    .scr {
      flex: 1;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 14px;
      padding: 14px 14px 18px
    }

    .scr.on {
      display: flex
    }

    .scr>* {
      flex-shrink: 0
    }

    .ttl {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px
    }

    .ttl h2 {
      margin: 0;
      font-family: var(--hd);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase
    }

    .ttl h2 i {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      vertical-align: middle;
      margin-left: 6px;
      box-shadow: 0 0 8px var(--green)
    }

    .ttl p {
      margin: 3px 0 0;
      font-size: 11px;
      color: var(--mute);
      letter-spacing: .06em;
      text-transform: uppercase
    }

    .pill {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      border: 1px solid var(--line2);
      border-radius: 6px;
      padding: 5px 8px;
      color: var(--mute);
      background: var(--panel);
      white-space: nowrap
    }

    .pill.am {
      border-color: rgba(245, 179, 66, .55);
      color: var(--amber);
      background: rgba(245, 179, 66, .08)
    }

    .pill.gr {
      border-color: rgba(74, 222, 128, .45);
      color: var(--green);
      background: rgba(74, 222, 128, .07)
    }

    .pill.rd {
      border-color: rgba(248, 113, 113, .5);
      color: var(--red);
      background: rgba(248, 113, 113, .08)
    }

    .pill.bl {
      border-color: rgba(91, 140, 255, .55);
      color: var(--blue2);
      background: rgba(91, 140, 255, .1)
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px
    }

    .card.hl {
      border-color: var(--blueT);
      box-shadow: 0 0 20px var(--glow)
    }

    .sec {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--hd);
      font-weight: 700;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin: 4px 0 0
    }

    .sec svg {
      color: var(--amber);
      flex: none
    }

    .sec .pill {
      margin-left: auto
    }

    .k {
      font-size: 10.5px;
      color: var(--mute);
      letter-spacing: .1em;
      text-transform: uppercase
    }

    .hint {
      font-size: 11.5px;
      color: var(--mute);
      margin: 0;
      line-height: 1.5
    }

    /* chips & inputs */
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
      margin: 0 -14px;
      padding: 0 14px
    }

    .chips::-webkit-scrollbar {
      display: none
    }

    .chip {
      flex: none;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--line2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text)
    }

    .chip.on {
      background: var(--blue);
      border-color: var(--blueT);
      color: #fff;
      box-shadow: 0 0 14px var(--glow)
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border: 1px solid var(--line2);
      border-radius: 10px;
      padding: 0 12px;
      height: 44px
    }

    .search input {
      flex: 1;
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 13px;
      letter-spacing: .04em;
      min-width: 0
    }

    .search input::placeholder {
      color: var(--dim);
      text-transform: uppercase
    }

    .search button {
      border: 0;
      background: transparent;
      color: var(--mute);
      padding: 4px
    }

    .seg {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 3px;
      gap: 2px
    }

    .seg button {
      flex: 1;
      border: 0;
      background: transparent;
      border-radius: 6px;
      padding: 7px 6px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text)
    }

    .seg button.on {
      background: var(--panel2);
      color: var(--blue2);
      box-shadow: inset 0 0 0 1px var(--line2)
    }

    .srt {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px
    }

    .srt .k {
      flex: none
    }

    .srt .seg {
      flex: 1
    }

    /* tile */
    .tile {
      position: relative;
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-family: var(--hd);
      font-weight: 700;
      font-size: 20px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .18);
      overflow: hidden
    }

    .tile::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(255, 255, 255, .18), transparent 45%, rgba(0, 0, 0, .35))
    }

    .tile em {
      position: absolute;
      bottom: 0;
      right: 0;
      font-style: normal;
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 700;
      background: var(--amber);
      color: #111;
      padding: 1px 3px;
      border-top-left-radius: 4px;
      z-index: 1
    }

    .tile.lg {
      width: 64px;
      height: 64px;
      font-size: 28px;
      border-radius: 12px
    }

    .tile.xl {
      width: 110px;
      height: 120px;
      font-size: 52px;
      border-radius: 12px;
      border-color: var(--amber)
    }

    .tile.xl em {
      font-size: 10px;
      left: 0;
      right: 0;
      text-align: center;
      border-radius: 0;
      padding: 3px
    }

    .tile.sm {
      width: 30px;
      height: 30px;
      font-size: 14px;
      border-radius: 7px
    }

    /* draft */
    .teams {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      position: relative
    }

    .team {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .team h3 {
      margin: 0 0 2px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding-left: 4px
    }

    .ally h3 {
      color: var(--blue2)
    }

    .enemy h3 {
      color: var(--red)
    }

    .slot {
      height: 40px;
      width: 100%;
      text-align: left;
      border-radius: 8px;
      border: 1px dashed var(--line2);
      background: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 6px;
      font-size: 11px;
      color: var(--dim);
      letter-spacing: .06em;
      text-transform: uppercase
    }

    .slot.on {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-weight: 700;
      font-size: 12px;
      text-transform: none;
      letter-spacing: 0
    }

    .ally .slot.on {
      box-shadow: inset 3px 0 0 var(--blue)
    }

    .enemy .slot.on {
      box-shadow: inset 3px 0 0 var(--red)
    }

    .slot .ed {
      margin-left: auto;
      color: var(--mute);
      display: grid;
      place-items: center
    }

    .slot span.nm {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .badge {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      background: var(--bg);
      border: 1px solid var(--amber);
      border-radius: 12px;
      padding: 6px 8px;
      text-align: center;
      box-shadow: 0 0 18px rgba(245, 179, 66, .3);
      min-width: 78px
    }

    .badge b {
      display: block;
      font-family: var(--hd);
      font-size: 22px;
      color: var(--amber);
      line-height: 1
    }

    .badge small {
      font-size: 8.5px;
      color: var(--mute);
      letter-spacing: .1em;
      text-transform: uppercase
    }

    .rec {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .rec .hd {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .rec .nm {
      font-family: var(--hd);
      font-size: 24px;
      font-weight: 700;
      color: var(--amber);
      text-transform: uppercase;
      line-height: 1
    }

    .rec .why {
      font-size: 12.5px;
      line-height: 1.5;
      margin: 0
    }

    .btn {
      border-radius: 10px;
      padding: 12px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      border: 1px solid var(--blue);
      background: transparent;
      color: var(--blue2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px
    }

    .btn.p {
      background: linear-gradient(90deg, #4D7CF0, #A9C3FF);
      border: 0;
      color: #0B1430;
      box-shadow: 0 0 18px var(--glow)
    }

    .btn.am {
      border-color: var(--amber);
      color: var(--amber)
    }

    .btn.rd {
      border-color: var(--red);
      color: var(--red);
      background: rgba(248, 113, 113, .07)
    }

    .btn:disabled {
      opacity: .35;
      cursor: default
    }

    .btn.sm {
      padding: 7px 10px;
      font-size: 11px
    }

    .alts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .alt {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
      font-size: 12.5px;
      font-weight: 700
    }

    .alt small {
      display: block;
      font-weight: 400;
      font-size: 10px;
      color: var(--mute);
      margin-top: 3px;
      letter-spacing: .06em;
      text-transform: uppercase
    }

    .alt:hover {
      border-color: var(--blueT)
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .rows {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .kv {
      display: flex;
      justify-content: space-between;
      font-size: 12px
    }

    .ok {
      color: var(--green)
    }

    .no {
      color: var(--red)
    }

    .alert {
      border: 1px solid rgba(245, 179, 66, .55);
      background: rgba(245, 179, 66, .07);
      border-radius: 12px;
      padding: 12px;
      font-size: 12.5px;
      line-height: 1.5;
      display: flex;
      gap: 10px
    }

    .alert.good {
      border-color: rgba(74, 222, 128, .5);
      background: rgba(74, 222, 128, .06)
    }

    /* metrics */
    .mets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 8px;
      gap: 8px;
      text-align: center
    }

    .met .k {
      font-size: 9.5px
    }

    .met b {
      display: block;
      font-family: var(--hd);
      font-size: 20px;
      margin: 4px 0 6px
    }

    .bar {
      height: 4px;
      border-radius: 2px;
      background: var(--line);
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      border-radius: 2px
    }

    .g {
      color: var(--green)
    }

    .a {
      color: var(--amber)
    }

    .r {
      color: var(--red)
    }

    .b {
      color: var(--blue2)
    }

    /* tier */
    .tierh {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .tb {
      font-family: var(--hd);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: .06em;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid;
      flex: none
    }

    .tb.SS {
      color: #FCA5A5;
      border-color: #E5484D;
      background: #3A1216
    }

    .tb.S {
      color: var(--blue2);
      border-color: var(--line2);
      background: #1B2438
    }

    .tb.A {
      color: var(--green);
      border-color: rgba(74, 222, 128, .45);
      background: rgba(74, 222, 128, .07)
    }

    .tb.B {
      color: var(--mute);
      border-color: var(--line2);
      background: var(--panel)
    }

    .tierh .t {
      flex: 1;
      min-width: 0
    }

    .tierh .t b {
      display: block;
      font-family: var(--hd);
      font-size: 14.5px;
      letter-spacing: .04em;
      text-transform: uppercase
    }

    .tierh .t small {
      font-size: 10.5px;
      color: var(--mute)
    }

    .tcard {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden
    }

    .tcard::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--amber)
    }

    .tcard.top {
      box-shadow: 0 0 22px rgba(245, 179, 66, .18)
    }

    .tcard .hd {
      display: flex;
      gap: 12px;
      align-items: flex-start
    }

    .tcard .nm {
      font-family: var(--hd);
      font-size: 21px;
      font-weight: 700;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .tcard .sub {
      font-size: 11.5px;
      color: var(--mute);
      margin-top: 3px
    }

    .tcard .ft {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--mute);
      gap: 8px
    }

    .lnk {
      border: 0;
      background: transparent;
      color: var(--blue2);
      font-weight: 700;
      letter-spacing: .08em;
      font-size: 11px;
      text-transform: uppercase;
      white-space: nowrap
    }

    .tbl {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden
    }

    .tbl .th,
    .tbl .tr {
      display: grid;
      grid-template-columns: 1fr 46px 46px 86px;
      align-items: center;
      gap: 6px;
      padding: 10px 12px
    }

    .tbl .th {
      font-size: 9.5px;
      color: var(--mute);
      letter-spacing: .1em;
      text-transform: uppercase;
      background: var(--panel2);
      border-bottom: 1px solid var(--line)
    }

    .tbl .th span:nth-child(n+2),
    .tbl .tr>span:nth-child(n+2) {
      text-align: right
    }

    .tbl .tr {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left
    }

    .tbl .tr:last-child {
      border-bottom: 0
    }

    .tbl .tr:hover {
      background: var(--panel2)
    }

    .who {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0
    }

    .who b {
      display: block;
      font-family: var(--hd);
      font-size: 14.5px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .who small {
      display: block;
      font-size: 10.5px;
      color: var(--mute);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .tag {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      border: 1px solid var(--line2);
      border-radius: 4px;
      padding: 3px 5px;
      color: var(--blue2);
      justify-self: end;
      white-space: nowrap
    }

    .radar {
      font-size: 12.5px;
      line-height: 1.6
    }

    .radar .hd {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px
    }

    .radar .hd b {
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      display: flex;
      gap: 6px;
      align-items: center
    }

    /* heroes list */
    .li {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px
    }

    .li:hover {
      border-color: var(--blueT)
    }

    .li .tb {
      font-size: 12px;
      padding: 3px 7px;
      margin-left: auto
    }

    /* hero detail */
    .strip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11px;
      letter-spacing: .06em;
